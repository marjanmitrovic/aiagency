name: Add AI audit card

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Insert multilingual AI audit card
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'id="ai-audit-card"' in s:
              print('AI audit card already present')
              raise SystemExit(0)
          marker = '    <section id="demo-products">'
          if marker not in s:
              raise SystemExit('Insertion marker not found')
          card = base64.b64decode('').decode('utf-8')
          s = s.replace(marker, card + marker, 1)
          p.write_text(s, encoding='utf-8')
          print('Inserted AI audit card')
          PY
      - name: Commit homepage update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add multilingual AI audit card to homepage"
            git push
          fi
